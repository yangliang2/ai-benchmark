[project]
name = "ai-benchmark"
version = "0.1.0"
description = "Coding-agent capability matrix: which agent x model is best for which task category, at what cost"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "mypy>=1.10",
    "types-pyyaml>=6",
]

[project.scripts]
ai-bench = "ai_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.mypy]
strict = true
files = ["src/ai_benchmark", "tests"]
