# First-party eval task set v0 (benchmark "first-party-v0").
#
# Each task is self-contained: the agent answers in its final output, and the
# check regex (re.search) grades that output as resolved (1.0) or not (0.0).
# Every task is classified into taxonomy v0 up front — no unclassified escape
# hatch here; these tasks exist to fill known capability-matrix cells.
#
# Grading limitation (v0, see CONTEXT.md): checks require task-specific
# content but are still static pattern checks, not execution — weaker
# evidence than SWE-bench's test-verified resolution. A v1 task set should
# grade by running tests.
- id: sumsq-off-by-one
  category: bug-fix
  scale: single-file
  language: python
  prompt: |
    This Python function should return the sum of squares of all items in xs,
    but it skips the first item. Reply with only the corrected function
    definition, no prose:

        def sumsq(xs):
            return sum(x * x for x in xs[1:])
  check: 'sum\(\s*(\w+)\s*(?:\*\s*\1|\*\*\s*2)\s+for\s+\1\s+in\s+xs\s*\)'
- id: slugify-function
  category: feature-dev
  scale: single-file
  language: python
  prompt: |
    Write a Python function named slugify(text) that lowercases the text and
    replaces every run of characters that are not a-z or 0-9 with a single
    hyphen, trimming leading/trailing hyphens. Reply with only the function
    definition, no prose.
  check: '(?s)^(?=.*def slugify\()(?=.*\.lower\(\))(?=.*-)'
- id: evens-comprehension
  category: refactor
  scale: single-file
  language: python
  prompt: |
    Refactor this function to a single return statement using a list
    comprehension, preserving behavior exactly. Reply with only the code:

        def evens(xs):
            out = []
            for x in xs:
                if x % 2 == 0:
                    out.append(x)
            return out
  check: 'return\s*\[\s*(\w+)\s+for\s+\1\s+in\s+xs\s+if\s+\1\s*%\s*2\s*==\s*0\s*\]'
- id: gcd-tests
  category: test-authoring
  scale: single-file
  language: python
  prompt: |
    Write pytest tests for Python's math.gcd in a single test function,
    asserting gcd(0, 0) == 0 and gcd(12, 18) == 6. Reply with only the code.
  check: '(?s)^(?=.*def test_)(?=.*assert\s+math\.gcd\(0,\s*0\)\s*==\s*0)(?=.*assert\s+math\.gcd\(12,\s*18\)\s*==\s*6)'
- id: trace-return-value
  category: codebase-comprehension
  scale: single-file
  language: python
  prompt: |
    Given this function:

        def f(n):
            total = 0
            for i in range(n):
                total += i * 2
            return total

    What does f(4) return? Reply with only the number.
  check: '\A\s*12\s*\Z'
- id: pytest-ci-workflow
  category: infra-config
  scale: single-file
  language: yaml
  prompt: |
    Write a minimal GitHub Actions workflow that runs pytest on every push,
    using Python 3.12. Reply with only the YAML.
  check: '(?s)^(?=.*\bon:)(?=.*push)(?=.*runs-on:)(?=.*3\.12)(?=.*pytest)'
