# crux is not stated. The prompt points at the module function that already
# embodies it — `operating_day`, which answers which day's working a moment
# belongs to — and leaves the rule itself to be read off there. The repo, the
# grading suite and the reference solution are identical across the four
# variants, and so is every non-crux criterion: the prompts share one block
# verbatim and differ only in the passage the crux travels in.
#
# K1 is `acceptance` in all four because K12 scopes the crux out of it (design
# note section 9): the spec's other decisions are stated as criteria in every
# variant, and only the crux's conveyance moves.
#
# The strength of this pointer, recorded before the sweep reads it. #32 asked
# every K12 family to say how much of the withheld decision its pointer hands
# over, because album's and pricelist's differed and a reconciler cannot tell
# a weak pointer from a failing level afterwards. This one is album-class and
# then some: `operating_day` is the whole of the withheld decision and nothing
# else, so a solver who follows the pointer has thereby decided the boundary
# and lands on the right sheet. If this variant misses, the level failed —
# there is no weaker reading of the pointer to fall back on.
#
# Round 3's third condition, and the one this variant carries first: the cost
# claim below runs in the LADDER's direction rather than the reading-burden
# direction round 2 registered. Round 2 bet that effort peaks at `unmentioned`
# and all eight of its readings missed, every one of them leaning the ladder's
# way instead (section 18). So the claim is now held by the harder member of
# each pair — repo-primitive against criterion here, prose against unmentioned
# in c4 — on cost rather than turns, at the round's standing 1.25x. Against
# round 2's own measurements this pair is the stringent one: repo-primitive
# divided by criterion came out 0.99x, 0.96x, 0.71x and 1.00x there, so the
# claim is registered against the only four readings anyone has, and it rests
# on the condition that changed — with the boundary no longer stated anywhere
