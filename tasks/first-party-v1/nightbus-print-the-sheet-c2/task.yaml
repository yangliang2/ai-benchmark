#
# What the calibration table cannot show, recorded because that row is where
# a reader meets this family. All four variants declare `K1=acceptance` and a
# K12 level, which is the profile key round 2's two families already occupy,
# so `calibrate-v1` pools this 32-line change into the same cells as album's
# 5 and pricelist's 9. K9 is not declared to hold them apart, because no one
# level of it would be true of all four variants: `single` is a labelled open
