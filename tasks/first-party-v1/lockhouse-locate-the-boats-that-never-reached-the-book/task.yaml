# fault-location, and the "say where it is" half of round 7's second
# TypeScript planted defect. Same starting repository as
# lockhouse-work-the-rest-of-the-night-through, byte for byte, and the same
# one defect: `Keeper.keep` in keeper.ts registers the boat coming up the cut
# with `once` where it must be `on`, so the first boat of the night is taken
# and worked through exactly as it should be and every boat behind it is given
# out to a listener that is no longer there. Same symptom in the prompt, too:
# both members do the same detective work and only the deliverable differs,
# which is what makes "what does locating cost, as against fixing?" a reading
# of two actions rather than of two repositories.
#
# The scenario is an asynchronous event flow — an emitter over `node:events`,
# boats queued one behind another behind a promise, and a night that settles
# when the work is done rather than after a length of time — which the Python
# corpus has nothing like (design note 45.11), and it is disclosed in the
# prompt and in the round record rather than as a task field.
#
# The accepted-answer key writes down both description levels that are
# legitimately correct for this defect: the method the subscription is made in,
# and the class enclosing it. Naming the module alone is not one of them — on a
# repository this small a bare filename is barely a location — and the class
# level says strictly less than the module here, because keeper.ts holds
# `Orders` beside `Keeper` rather than `Keeper` alone.
#
# The terrain is what makes locating this work rather than a grep. `.once(` and
# `.on(` are a shape a grep finds in one pass, so the repository holds seven
# more registrations across all four modules and every one of them is correct:
# `Book.headed` heads the page off the first boat up, `Book.marked` notes the
# mark off the first drawing of water, `Lock.drawn` waits for the next drawing
# and no more of them, `Cut.whenShutting` and the wait inside `Keeper.keep`
# hang on a night shutting once, and `Tally` and the lockful count in
# `Keeper.keep` take every boat and every drawing there is. Two of the three
# events are registered *both* ways somewhere in the repository, and each way
# is right where it stands, so the shape decides nothing at all: what decides
# it is how often the thing waited for happens, which no pattern shows. Three
# of the eight are in keeper.ts itself, so reaching the right file finishes
# nothing. The nearest twin is `Book.headed`: it listens for the first of the
# very same event and is correct, because a page is headed once — which is the
# whole discrimination.
#
# The contract the defect breaks is stated in keeper.ts's module comment and in
# the README, both a file's length from the line that breaks it. And the
# symptom the prompt reports points elsewhere first: the page is written in
# book.ts, and the tally that says four boats came up against a page holding
# one is in lock.ts, beside the lock that worked exactly one of them. Those are
# the rejected near-misses no lint can invent.
#
# The hash gate is this corpus's own held-out gate for a keyed task: an agent
# that does the fix work and then writes a correct answer would grade resolved
# at fix-member cost, contaminating the one measurement this pair exists to
# produce, with nothing in the log to show it. So the repository the agent was
# handed is hashed, and a run that changed any of it grades unresolved. The
# prompt says so outright. It is generated by `ai-bench lint-v1
# --write-hash-gates` and never typed, and it is canonical Python whatever the
# repository's language, because what it reads is file digests and not source.
#
# What proves there is a defect here at all is this task's existence proof,
# and for fault-location that is the paired bug-fix member's held-out tests
# failing on this same pristine repository. A checked relation rather than a
# convention: the two declare no link — they are deliberately neither a task
# family nor a pair — so the lint finds the partner by the bytes of the repo/
# the two share, and runs it.
#
# A control: authored to fill a category, claiming nothing about difficulty.
# The two members are deliberately neither a task family nor a pair — both
# constructs require one varied knob and an agreed category, and these vary no
# knob and differ in category.
id: lockhouse-locate-the-boats-that-never-reached-the-book
category: fault-location
scale: single-file
surface: application
language: typescript
control: true
# The nouns a prompt about a lock on a canal and a repository about one cannot
# help sharing. Read by the task-set lint's narrowing terrain rule, which holds
# every other word of the prompt to appearing in more than the module the
# accepted answer names.
domain_nouns: [boat, boats, lock, lockhouse, cut, chamber, gate, water, pound,
               page, book, night, tally, order, orders, standing, gauge,
               gauged, minutes, tons, event, events, node, library, program]
prompt: |
  Something has gone wrong at the lock on the cut. What is in front of you is
  a night at the lockhouse: a small program written on the Node standard
  library alone, with nothing installed under it, in which everything that
  happens on the water arrives as an event and is dealt with as it arrives.

  Four boats came up on Tuesday evening, one behind another, and the first of
  them was still in the chamber when the second reached the gate. The tally at
  the foot of the page says four came up. The page has one line on it — the
  first boat, worked through and written up exactly as it should be — and
  nothing whatever after that. The three behind it were neither taken nor
  sent back nor written up, and the men on them were still at the gate at
  midnight.

  What the lockhouse means to do is this: every boat that comes up is taken,
  one at a time and in the order it came, and every one of them is written up
  in its place, whether it went through or was sent back. A boat that comes up
  while another is in the chamber has missed nothing, and the night is not
  over until the last of them is out at the far end.

  Say where that defect lives. Do not fix it, and leave every file in the
  repository exactly as you found it: the deliverable is the location and not
  a repair, and a run that edits the code is graded unresolved however well it
  answers.

  Write your answer to ANSWER.json in the root of the repository, as a JSON
  object with two string fields: "file", the path of the file the defect is in
  relative to the repository root, and "symbol", the function, class or method
  it lives in (a method written as Class.method).
