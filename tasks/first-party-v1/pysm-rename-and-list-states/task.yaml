# K7 at calm, and the control side of the pysm-pushdown pair (#41). Same
# vendored pysm snapshot as pysm-push-and-pop-states, byte for byte, so the
# two members are matched on the thing round 1's K7 reading could not control
# for: repository size. What differs is where the change lands.
#
# Calm means this: pysm/builder.py is a 105-line opt-in fluent helper nothing
# else in the package imports, and its whole state is one dictionary from path
# tuple to state. A rename is a rekeying of that dictionary, and the two
# things that make it more than a one-liner are both written in the file being
# edited — every path *through* the renamed state is a key that has to move
# with it, and _normalize_path reads a string path by splitting it on '/', so
# a name holding one could never be spelled back. Calm is not easy; it is
# local rather than sealed off — what the change reaches for outside
# pysm/builder.py is one public attribute written as plain data, a state's
# `name`, which carries no unstated contract that could be got wrong. The crux
# beside it turns on four such contracts, decided four frames away in code the
# prompt never mentions.
#
# Matched with pysm-push-and-pop-states on write volume, the axis #39 added to
# the pair design: the two reference solutions add 26 and 28 lines to the same
# snapshot, a ratio of 1.08, and the suite asserts the match. Without it
# "dense terrain costs more" and "the dense task was bigger" are the same
# measurement. This member registers no effort claim, as a control does not.
#
# The snapshot carries no knob-setting edit, so `modifications` is empty:
# the density this pair is pitched on is the library's own, as round 1's two
# K7 tasks were, and an edit would break the byte-identity the pair rests on
# anyway. Empty is not the same as untouched — what was left out of every
# pysm snapshot for reasons answering to no knob, down to the two
# MicroPython-fallback import tests that reach for pysm/pysm.py through the
# upstream test/ layout, is recorded in
# docs/research/substrate-candidate-repos.md, because `modifications` is not
# the place for it.
#
# K7 has no enumerated ladder in KNOB_LEVELS, so "calm" is recorded as written
# and nothing checks that another task's K7 level means the same thing.
#
# feature-dev: the grading tests exercise rename and paths, neither of which
# exists in repo/, so they fail on the pristine repository as the lint
# requires.
id: pysm-rename-and-list-states
category: feature-dev
scale: single-file
surface: application
language: python
prompt: |
  pysm/builder.py can only add. A state given the wrong name has to be built
  again from the start, and there is no way to ask the builder what it is
  holding.

  Add both to StateMachineBuilder.

      def rename(self, path, name):

  It renames the state at `path` — in any of the spellings the builder already
  accepts — to `name`. What it comes to:

    * the state answers to its new name afterwards, and so does everything
      built under it: a path that ran through the renamed state runs through
      its new name instead, and states added under it later go to the new
      path;
    * the root machine can be renamed like any other state;
    * a name another state under the same parent already uses is refused with
      StateMachineException, and a refused rename changes nothing;
    * renaming a state to the name it already has is allowed and changes
      nothing;
    * an empty name, or one with a '/' in it, is refused the same way — the
      builder reads a string path by splitting it on '/', so neither could be
      written back;
    * a path naming nothing the builder has is refused, as it already is
      elsewhere;
    * it returns the builder, so calls can be chained.

      def paths(self):

  It returns the path of every state the builder holds, as the tuples of names
  the builder keys them by: the root machine's own path first, and the rest in
  alphabetical order. Asking builds nothing.

  Everything else about the builder stays as it is.
construction:
  knobs:
    - id: K7
      level: calm
  pair: pysm-pushdown
  prediction:
    rung: haiku-solvable
    rationale: >-
      every rule is stated outright — what happens to the paths underneath,
      that the root is renamable, which two names are refused and why, that a
      refusal changes nothing, what order the paths come back in — so nothing
      is left open, and the module is 105 lines of self-contained bookkeeping
      that no other part of the package imports. The control's job is to be
      the same amount of code to write as the crux beside it over a read set a
      fraction of the size: if this one lands anywhere but the bottom rung,
      the pair is measuring how hard the task was rather than how dense the
      terrain is, and the round's cost reading should be discounted
      accordingly
  substrate:
    origin: https://github.com/pgularski/pysm
    commit: 0c47a5067974951c75a498ee4ed025cf881f48fd
    license: MIT
