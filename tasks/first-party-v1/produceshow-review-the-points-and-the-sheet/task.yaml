# code-review, the fourth of them in the corpus, and authored to the shape
# `launderette-review-the-rate-and-the-card` landed and the two after it
# copied: the agent is handed a change that has already been applied to the
# starting repository, plus the unified diff of it the prompt names
# (repo/review.diff), and asked which of it is wrong. There is no second tree
# it can see — the change lives inside the repository — and the deliverable is
# the findings file, never an edit.
#
# The change is a summer's work at a village produce show: the sheet a steward
# takes round a class, and what the judging came to once the judges have been
# through. It reads as a piece of work rather than as three bugs in a row,
# which is what a review has to be graded on: the house rules it is meant to
# keep are the README's, written down as the change was asked for and in the
# committee's own words, so each planted finding is the code disagreeing with
# a rule somebody wrote down rather than a matter of taste.
#
# The three planted findings, each named here by its primary — the most
# specific location, which is the first alternative in the key:
#
#   points.py points_for        the table of placings is asked first and
#                               returned out of, so the championship stands
#                               under a rule that has already answered for it:
#                               a first in the championship class is worth the
#                               same four as any other first.
#   points.py tally             the empty tally is written into the signature,
#                               where it is made once and lives as long as the
#                               module does, so the second section a steward
#                               brings is added to the first one's points.
#   entries.py Book.of_class    the walk ends at the first entry of another
#                               class instead of stepping over it, so a sheet
#                               stops short — and the book is in no class
#                               order, which is a rule of the house older than
#                               this change.
#
# Deliberately three shapes none of the first three review tasks carries: they
# plant a boundary tested strictly, a counter never cleared, a list ordered the
# wrong way up, a substring where an equality was meant, a grouping lost to
# last-wins, a caller sorting a list it does not own, two rules composed in the
# wrong order, a zero read as nothing, and a list mutated under the walk that
# reads it. A special case written under the general rule that will answer
# first, a default made once at import and kept between calls, and a walk ended
# where it should have been stepped over are three further ways for a plausible
# change to be wrong, and no repetition of those nine.
#
# A planted finding is a set of alternative locations and is matched if an
# answer matches any one of them, so each finding here writes down every level
# that legitimately describes it. Which is one level for two of the three:
#
#   points_for      is defined at module level, and points.py defines no class
#                   at all, so there is no enclosing class to be a second
#                   description of it.
#   tally           is defined at module level too, in that same file.
#   Book.of_class   is a method of `Book`, and entries.py defines `Entry`
#                   beside it, so `entries.py Book` is a second alternative:
#                   telling the two classes apart takes reading them.
#
# Beneath the alternatives the comparison's own forgiveness still applies: a
# bare symbol answers a key spelled `Class.method`, so `of_class` and
# `Book.of_class` both answer the third finding.
#
# The rejected non-findings are the two places a reviewer plausibly points at
# and is wrong to, and they are the half no lint can invent: `champion` is the
# caller whose cup goes to the wrong exhibitor, because it reads a tally the
# two defects above got wrong, and is itself correct; `Book.judged` writes the
# later placing over the earlier one with no record of what it replaced, which
# reads like a lost edit and is exactly what the house rules ask for — a class
# judged a second time is judged afresh.
#
# Each planted finding carries its existence proof in proofs/ — one per
# finding, named after its primary: a held-out test that fails on repo/, which
# ships the change applied, and passes on corrected/, the same repository with
# all three put right. A finding is one defect however many locations describe
# it, so it owes one proof and not one per alternative. Both trees sit beside
# repo/ and outside grading/, which is overlaid into the workdir wholesale, so
# the lint runs them and grading can neither collect nor copy them.
#
# The terrain: the prompt names neither a file nor a symbol of either half of
# the key, and its own vocabulary is either English's or the domain's below or
# appears outside the modules the findings live in — show.py and stewards.py
# are untouched by the change and carry the words a prompt about a produce show
# cannot avoid, and each of them writes correctly the very thing a finding gets
# wrong: stewards.py steps over the steward of another tent rather than ending
# its walk there, defaults a round to None and makes the empty one inside the
# call, and asks the narrower rule before the broader one that would answer for
# it. The repository's own tests are green as it ships and name none of the
# three planted symbols: what the change added tests for is the part of it that
# works — the table of placings, the cup, and a class judged a second time.
#
# The prompt's last three paragraphs are the first three review tasks', near
# enough word for word, and on purpose: what the deliverable is, how the
# findings file is shaped, and that an edited repository grades unresolved are
# the rules of this action rather than of this task, and four review tasks whose
# agents were told them differently would differ by their instructions as much
# as by their changes. What is this task's own is the paragraph that says which
# show this is and which change is under review.
#
# The hash gate is the generator's (`ai-bench lint-v1 --write-hash-gates`) and
# never typed, and the prompt says outright what it enforces: the deliverable
# is the findings file, and a run that edited the code is graded unresolved
# however well it reviewed the change.
#
# A control: authored to fill a category, claiming nothing about difficulty. It
# is neither a family member nor a pair member, and it names no behaviour
# tests — those are a refactor task's.
id: produceshow-review-the-points-and-the-sheet
category: code-review
# The reference solution is the pristine tree plus the findings file, so the
# diff a solved run logs touches exactly one file.
scale: single-file
surface: application
language: python
control: true
# The nouns a prompt about a village produce show and a repository about one
# cannot help sharing. Read by the task-set lint's narrowing terrain rule,
# which holds every other word of the prompt to appearing somewhere other than
# the modules the planted findings live in.
domain_nouns: [show, shows, village, produce, committee, class, classes,
               section, sections, schedule, entry, entries, exhibitor,
               exhibitors, judge, judges, judged, judging, place, places,
               placing, point, points, cup, steward, stewards, tent, book,
               sheet, sheets, championship, day, days]
prompt: |
  This repository is what the committee of a village produce show keeps its
  entries in, and review.diff in its root is a change that has already been
  applied to it: what that change was for is the last few house rules of the
  README, which were written down as it was asked for, and the code around it
  is what it looks like now.

  Read the change against those rules and say what is wrong with it. Report
  every problem it introduced and nothing that is not one — somewhere it got
  right, reported as a problem, is as wrong an answer as a problem you never
  mention.

  Write what you find to FINDINGS.json in the root of the repository, as a
  JSON list with one object per problem, each with "file" (the path, relative
  to the root of the repository, of the file the problem is in), "symbol" (the
  function, class or method it is in, a method written as Class.method) and,
  if you like, "note" (a sentence on what is wrong there). Nothing reads the
  note.

  That file is the deliverable. Do not put any of it right, and leave every
  other file exactly as you found it: a run that edits the code is graded
  unresolved however well it reviewed the change.
