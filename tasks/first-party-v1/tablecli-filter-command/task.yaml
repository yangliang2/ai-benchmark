# feature-dev: the grading tests exercise tabular.matches and the cli
# "filter" command, neither of which exists in repo/, so they fail on the
# pristine repository as the lint requires.
id: tablecli-filter-command
category: feature-dev
scale: cross-file
language: python
prompt: |
  This repository reads small comma-separated tables (tabular.py) and
  answers commands about them (cli.py — "columns" and "count" so far).
  Users want to filter rows from the command line.

  - tabular.py gains `matches(row, condition)`: whether one parsed row
    satisfies a condition string of the form <column><operator><value>,
    with operators =, !=, >, <, >= and <=. The = and != comparisons are on
    the cell text; the four ordering comparisons parse both the cell and
    the value as numbers and raise ValueError when either is not numeric.
    A condition naming a column the row does not have raises ValueError
    naming that column, and a condition with no recognisable operator
    raises ValueError.
  - cli.py gains a "filter" command taking one or more condition arguments:
    `main(["filter", "age>30", "team=red"], text)` returns the table
    re-rendered exactly as `render()` produces it (header line included,
    column order kept) with only the rows meeting every condition. "filter"
    with no conditions raises ValueError.

  Keep the existing commands and their behaviour unchanged, and keep the
  modules dependency-free (standard library only).
