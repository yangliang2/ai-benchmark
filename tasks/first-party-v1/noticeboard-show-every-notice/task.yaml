# bug-fix, and the "fix it" half of round 4's first planted defect: one
# off-by-one at a boundary, authored twice over one starting repository.
# Paginator.page_count in paging.py floors where it should round up, so a
# partial last page is not a page at all and the items on it are unreachable
# — through page(), which refuses a number past the count, and through
# Noticeboard, which spreads the notices over exactly as many boards as the
# count claims. The repository's own tests are green on the pristine tree:
# every fixture in them divides exactly, which is how a defect at a boundary
# stays invisible, and a visible test reproducing the symptom would hand the
# agent the answer and delete the action being measured.
#
# The terrain is authored so that finding the line is work rather than a grep,
# because the fault-location member built on this same repository is measured
# on exactly that: the same floor division, spelled the same way, is correct in
# Noticeboard.full_boards, and the contract a partial last board is owed is
# stated in paging.py's module docstring and in the README rather than beside
# the line that breaks it.
#
# The held-out tests fail on the pristine repository, as the lint requires,
# and that failure is also what proves there is a defect for the
# fault-location member built on this same repository to find: that pairing is
# a convention rather than a checked relation (design note 36.2), so the two
# members are authored together and share repo/ byte for byte.
#
# A control: authored to fill a category, claiming nothing about difficulty.
# The two members are deliberately neither a task family nor a pair — both
# constructs require one varied knob and an agreed category, and these vary no
# knob and differ in category.
id: noticeboard-show-every-notice
category: bug-fix
scale: single-file
language: python
control: true
prompt: |
  The village noticeboard is losing notices. With nine notices posted and four
  to a board, it shows two boards of four: the oldest notice is on neither of
  them, and asking for a third board raises IndexError instead of showing it.
  With eight notices posted the same board shows all eight, so it only goes
  wrong for some numbers of notices.

  Fix it, so that every posted notice is on a board: the notices fill boards of
  at most the size the board is set to, and the last board carries however few
  are left over. Nothing else about the boards changes — the order the notices
  are shown in, the notices on a board that is full, and the refusal of a board
  number nobody posted enough notices to fill all stay as they are.
