# adjacent knob, as far as two pairs can be.
#
# The snapshot carries no knob-setting edit, so `modifications` is empty: the
# coordination width this pair is pitched on is the library's own duplicated
# machinery, not something planted, and an edit would break the byte-identity
# the pair rests on anyway. Empty is not the same as untouched — what was
# left out of every pysm snapshot for reasons answering to no knob is
