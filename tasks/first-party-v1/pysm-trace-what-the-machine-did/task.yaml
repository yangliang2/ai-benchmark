#
# feature-dev, cross-file: the reference diff touches pysm/pysm.py,
# pysm/queued.py and pysm/aio.py, and the grading tests exercise a `trace`
# that does not exist in repo/, so they fail on the pristine repository as
# the lint requires.
id: pysm-trace-what-the-machine-did
category: feature-dev
scale: cross-file
language: python
prompt: |
  pysm machines forget what they did. A handler can see where the machine is
  now, but after a run there is nothing to read back: no record of which
  states were entered and left, in what order, or of which events waited.

  Give StateMachine a `trace`.

    * `trace` is a list and it starts empty. Like `leaf_state` it belongs to
      the root machine: every layer writes to the root machine's trace, and a
      nested machine's own trace stays empty however often its states are
      entered and left.
    * Every entry is a pair, `(kind, name)`, and there are five kinds:

        ('event', name)     an event has reached an initialized machine and
                            is about to be handled
        ('exit', name)      a state's `exit` handler is about to run
        ('enter', name)     a state's `enter` handler is about to run
        ('queued', name)    a dispatched event is being put aside instead of
                            handled now, because the machine is already
                            running one
        ('dropped', name)   an event that was put aside is being thrown away
                            without ever being handled

      `name` is the state's name for `enter` and `exit`, and the event's name
      for the other three.
    * Entries go on in the order the things happened, and nothing is ever
      taken off.
    * An event reaching a machine that was never initialized is refused as it
      is today and records nothing; an event matching no transition still
      records having reached the machine.
    * Initializing without firing the entry handlers records nothing;
      initializing with them records the initial path being entered.

  This package runs machines three ways — the classic core, the queued layers
  in pysm/queued.py, and the asyncio layer in pysm/aio.py — and all three
  record the same way. What that comes to is this: one graph, initialized and
  sent the same events, comes out with the same trace whichever ran it.

  Everything else about the library stays as it is: the transitions, the
  handlers and the history stacks are all unchanged.
construction:
  knobs:
    - id: K10
      level: wide
  pair: pysm-trace
  prediction:
    rung: haiku-solvable
    rationale: >-
      every rule is stated outright and no single site is hard: ten of the
      fourteen are one line appended to a list, the two that record thrown-away
      events are four apiece, the largest is a five-line docstring entry, and
      every module they live in is named in the prompt. The bet is on price
      and not on the rung,
      because the mechanism here is width rather than depth — fourteen places
      to carry one decision to, twelve of them the same line, spread over
      three modules of which two are copies of machinery the third also has,
      while the control beside it asks for the same twenty-odd lines at two
      sites in two of those same modules.
      The rung is registered at the floor because that is where round 2's
      sixteen bottom-rung bets went fourteen for sixteen and where upward
      bets outside K1 stand at nought for fourteen lifetime; a fifteenth is
      not worth the falsification record. What could beat this prediction is
      the one thing the design is built to make visible — an answer that
      stops after the core and the queued layer, which the cross-layer
      grading test refuses — and if that is what comes back the rung moves
      for the reason the knob names. Prompt length is checked here rather
      than assumed away, and it needs no defusing arithmetic because it runs
      the wrong way for this task: the brief is 324 words to the control's
      331, a ratio of 0.98, so the member holding the claim is the shorter of
      the two and a cost hit cannot be read off a longer brief. If the wide
      side does not cost more here, with the repository byte-identical, write
      volume matched to 1.08 and every module named, coordination width has no
      price to charge on this material and the round says so
    effort:
      comparator: pair
      metric: cost
      at_least_factor: 1.25
