# (#42). K10 — coordination width, N consistent edit sites — has been in
# section 9's list since round 1 and has never been built: section 16.2 named
# it a secondary candidate, section 23.9 recorded it still untouched after
# round 2, and the round-3 spec commissioned it. So there is no prior reading
# of this knob at any level, which is also why the effort factor below cannot
# be fitted to one.
#
# Wide means this, counted rather than described: the reference solution
# touches 14 places in 3 modules, and 12 of them are the same recording
# written again — ten of those a single appended line, the two that record
# thrown-away events four apiece; the remaining two places declare the
# attribute and document it. The suite counts the hunks of the reference diff
# and holds this member to the 8-15 band the ticket asks for and the control
# to a handful. What makes the 12 irreducible is the shape of the library
# rather than a rule the task invents: pysm/aio.py does not override the
# core's entry walk, exit walk and dispatching step, it carries its own
# copies of all three, and pysm/queued.py carries its own copy of the queue
# draining. A decision about what those walks record therefore has to be
# written out once per copy, and inheritance cannot collect them. The prompt
# states the rule for every layer and states the consequence — one graph
# driven the same way records the same trace whichever layer ran it — so
# nothing here is withheld; what is being asked for is that a stated rule be
# carried to all of its sites.
#
# The control beside it, pysm-list-the-waiting-events, is the same kind of
# change — a small addition mirrored across the package's execution layers —
# at 2 sites instead of 14. Matched with it on write volume, the axis #39
# added to the pair design: the two reference solutions add 24 and 26 lines
# to the same snapshot, a ratio of 1.08, and the suite asserts the match.
# Without it "many sites cost more" and "the wide task was bigger" are the
# same measurement, which is the confound round 2's K9 result was rejected
# for.
#
# What this pair holds that its K4 sibling varies, and the reverse, recorded
# because the two knobs are adjacent and a reader is owed the difference:
# here the site count moves (14 against 2) while both members are told which
# modules to edit, and in the K4 pair (pysm-refuse-a-snapshot-in-flight
