# fault-location, and the "say where it is" half of round 7's third TypeScript
# planted defect. Same starting repository as
# telegraph-write-up-the-last-message-of-the-day, byte for byte, and the same
# one defect: `Cutter._flush` in messages.ts clears the tape it has read past
# the last mark instead of giving it out, so the last message of the day — the
# one with no mark after it, because nothing was sent after it — is held until
# the drum stops and then dropped. Same symptom in the prompt, too: both
# members do the same detective work and only the deliverable differs, which is
# what makes "what does locating cost, as against fixing?" a reading of two
# actions rather than of two repositories.
#
# The scenario is a stream pipeline — `node:stream` transforms strung end to
# end with `node:stream/promises`' `pipeline`, a source that gives out a length
# of tape only when one is asked for, and a sink whose high-water mark is what
# keeps the whole day's traffic from standing in the office at once — which the
# Python corpus has nothing like (design note 45.11), and it is disclosed in
# the prompt and in the round record rather than as a task field.
#
# The accepted-answer key writes down both description levels that are
# legitimately correct for this defect: the hook the tape is thrown away in,
# and the class enclosing it. Naming the module alone is not one of them — on a
# repository this small a bare filename is barely a location — and the class
# level says strictly less than the module here, because messages.ts holds
# `Wire` beside `Cutter` rather than `Cutter` alone.
#
# The terrain is what makes locating this work rather than a grep. A stream
# stage's end-of-input hook is a shape a grep finds in one pass, so the
# repository holds four more of them across three modules and every one is
# correct: `Totting._flush` gives out the foot of the page it has been adding
# up all day, `Repeats._flush` gives out nothing at all and is right to,
# `Sheet._final` has nothing owing because every line went down as it arrived,
# and `Drum._read` says the tape has run out. Both answers to "what does a
# stage owe when the input ends?" are written correctly somewhere in the
# repository, so the shape decides nothing at all: what decides it is whether
# the stage is still holding something nobody downstream has seen, which no
# pattern shows. The nearest twin is `Repeats._flush`: it holds something
# across the whole day and gives out nothing, and is correct, because what it
# holds went down the office as it came — which is the whole discrimination.
#
# The contract the defect breaks is stated in messages.ts's module comment and
# in the README, both a file's length from the line that breaks it. And the
# symptom the prompt reports points elsewhere first: the page and its foot are
# written in sheet.ts, which holds two of the four correct hooks, and the foot
# that says three messages against a tape that carried four is the loudest
# thing in the repository. Those are the rejected near-misses no lint can
# invent.
#
# The hash gate is this corpus's own held-out gate for a keyed task: an agent
# that does the fix work and then writes a correct answer would grade resolved
# at fix-member cost, contaminating the one measurement this pair exists to
# produce, with nothing in the log to show it. So the repository the agent was
# handed is hashed, and a run that changed any of it grades unresolved. The
# prompt says so outright. It is generated by `ai-bench lint-v1
# --write-hash-gates` and never typed, and it is canonical Python whatever the
# repository's language, because what it reads is file digests and not source.
#
# What proves there is a defect here at all is this task's existence proof, and
# for fault-location that is the paired bug-fix member's held-out tests failing
# on this same pristine repository. A checked relation rather than a
# convention: the two declare no link — they are deliberately neither a task
# family nor a pair — so the lint finds the partner by the bytes of the repo/
# the two share, and runs it.
#
# A control: authored to fill a category, claiming nothing about difficulty.
# The two members are deliberately neither a task family nor a pair — both
# constructs require one varied knob and an agreed category, and these vary no
# knob and differ in category.
id: telegraph-locate-the-message-left-on-the-tape
category: fault-location
scale: single-file
surface: application
language: typescript
control: true
# The nouns a prompt about a day at a telegraph office and a repository about
# one cannot help sharing. Read by the task-set lint's narrowing terrain rule,
# which holds every other word of the prompt to appearing in more than the
# module the accepted answer names.
domain_nouns: [telegraph, office, traffic, tape, drum, length, lengths, mark,
               marks, message, messages, sheet, foot, page, line, lines, day,
               days, word, words, pence, charge, charges, charged, hand, hands,
               wire, wires, address, addressed, sent, send, node, library,
               program, rate, reel, tuesday]
prompt: |
  Something has gone wrong at the telegraph office. What is in front of you is
  one day's traffic: a small program written on the Node standard library
  alone, with nothing installed under it, in which the day's tape comes off the
  drum a length at a time and is worked through the office from one end to the
  other, no faster than the far end will take it.

  Four messages were sent on Tuesday. The tape ran out with the last of them on
  it: nothing was sent after it, so nothing came after it on the tape. The day
  sheet has three lines — the first three messages, addressed, charged and
  written up exactly as they should be — and the foot of the sheet says three
  messages and 46 pence. The fourth was sent, it is on the tape, it is on no
  line of the sheet, and nothing anywhere says the office ever had it.

  What the office means to do is this: every message on the day's tape is read
  off it, charged and written up in its place, in the order it was sent, and
  the last message of a day is not a different thing from the ones before it
  because nothing was sent after it. The foot counts what the sheet holds.

  Say where that defect lives. Do not fix it, and leave every file in the
  repository exactly as you found it: the deliverable is the location and not
  a repair, and a run that edits the code is graded unresolved however well it
  answers.

  Write your answer to ANSWER.json in the root of the repository, as a JSON
  object with two string fields: "file", the path of the file the defect is in
  relative to the repository root, and "symbol", the function, class or method
  it lives in (a method written as Class.method).
