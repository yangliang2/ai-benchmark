# code-review, the second of them in the corpus, and authored to the shape
# `launderette-review-the-rate-and-the-card` landed: the agent is handed a
# change that has already been applied to the starting repository, plus the
# unified diff of it the prompt names (repo/review.diff), and asked which of it
# is wrong. There is no second tree it can see — the change lives inside the
# repository — and the deliverable is the findings file, never an edit.
#
# The change is a fortnight's work at a village tool shed: looking a tool up by
# the label on its handle, and a desk that can print what is out and give a
# member their own slip. It reads as a piece of work rather than as three bugs
# in a row, which is what a review has to be graded on: the house rules it is
# meant to keep are the README's, written down as the change was asked for and
# in the shed's own words, so each planted finding is the code disagreeing with
# a rule somebody wrote down rather than a matter of taste.
#
# The three planted findings, each named here by its primary — the most
# specific location, which is the first alternative in the key:
#
#   labels.py matching        the label wanted is tested with `in` against the
#                             label on the tool, which is a substring and not a
#                             label, so the saw answers to a request for the
#                             jigsaw and the other way about.
#   loans.py Book.by_member   the listing is built as one mapping entry per
#                             loan, so a member's second loan replaces their
#                             first and only the last of them is ever shown.
#   desk.py slip              the slip is printed off the book's own list,
#                             sorted in place, so printing one member's slip
#                             leaves the book in an order nobody asked for.
#
# Deliberately three shapes the first review task does not carry: it plants a
# boundary tested strictly, a counter never cleared, and a list ordered the
# wrong way up. A substring where an equality was meant, a grouping lost to
# last-wins, and a caller sorting a list it does not own are three different
# ways for a plausible change to be wrong, and no repetition of those.
#
# A planted finding is a set of alternative locations and is matched if an
# answer matches any one of them, so each finding here writes down every level
# that legitimately describes it. Which is one level for two of the three:
#
#   matching        is defined at module level, so there is no enclosing class
#                   to be a second description of it.
#   Book.by_member  is a method of `Book`, and loans.py defines `Loan` beside
#                   it, so `loans.py Book` is a second alternative: telling the
#                   two classes apart takes reading them.
#   slip            is defined at module level too, and desk.py defines no
#                   class at all.
#
# Beneath the alternatives the comparison's own forgiveness still applies: a
# bare symbol answers a key spelled `Class.method`, so `by_member` and
# `Book.by_member` both answer the second finding.
#
# The rejected non-findings are the two places a reviewer plausibly points at
# and is wrong to, and they are the half no lint can invent: `tidy` is the
# normalising the change introduced, and squaring up spacing and case is
# exactly what was asked of it; `board` is the caller whose printed lines come
# out short, because it prints a listing the defect above got wrong, and is
# itself correct.
#
# Each planted finding carries its existence proof in proofs/ — one per
# finding, named after its primary: a held-out test that fails on repo/, which
# ships the change applied, and passes on corrected/, the same repository with
# all three put right. A finding is one defect however many locations describe
# it, so it owes one proof and not one per alternative. Both trees sit beside
# repo/ and outside grading/, which is overlaid into the workdir wholesale, so
# the lint runs them and grading can neither collect nor copy them.
#
# The terrain: the prompt names neither a file nor a symbol of either half of
# the key, and its own vocabulary is either English's or the domain's below or
# appears outside the modules the findings live in — shed.py and rota.py are
# untouched by the change and carry the words a prompt about a tool shed cannot
# avoid, and each of them writes correctly the very thing a finding gets wrong:
# shed.py groups tools under the rack each belongs to, and rota.py compares a
# day against the whole of a day and not a part of one. The repository's own
# tests are green as it ships and name none of the three planted symbols: what
# the change added tests for is the part of it that works.
#
# The prompt's last three paragraphs are the first review task's, near enough
# word for word, and on purpose: what the deliverable is, how the findings file
# is shaped, and that an edited repository grades unresolved are the rules of
# this action rather than of this task, and two review tasks whose agents were
# told them differently would differ by their instructions as much as by their
# changes. What is this task's own is the paragraph that says which shed this
# is and which change is under review.
#
# The hash gate is generated (`ai-bench lint-v1 --write-hash-gates`) and the
# prompt says outright what it enforces: the deliverable is the findings file,
# and a run that edited the code is graded unresolved however well it reviewed
# the change.
#
# A control: authored to fill a category, claiming nothing about difficulty. It
# is neither a family member nor a pair member, and it names no behaviour
# tests — those are a refactor task's.
id: toolshed-review-the-lending-book
category: code-review
# The reference solution is the pristine tree plus the findings file, so the
# diff a solved run logs touches exactly one file.
scale: single-file
surface: application
language: python
control: true
# The nouns a prompt about a tool shed and a repository about one cannot help
# sharing. Read by the task-set lint's narrowing terrain rule, which holds
# every other word of the prompt to appearing somewhere other than the modules
# the planted findings live in.
domain_nouns: [shed, tool, tools, desk, loan, loans, member, members, label,
               labels, handle, handles, rack, racks, day, days, saw, jigsaw,
               volunteer, volunteers]
prompt: |
  This repository is what the volunteers behind the desk of a village tool
  shed have their loans in, and review.diff in its root is a change that has
  already been applied to it: what that change was for is the last few house
  rules of the README, which were written down as it was asked for, and the
  code around it is what it looks like now.

  Read the change against those rules and say what is wrong with it. Report
  every problem it introduced and nothing that is not one — somewhere it got
  right, reported as a problem, is as wrong an answer as a problem you never
  mention.

  Write what you find to FINDINGS.json in the root of the repository, as a
  JSON list with one object per problem, each with "file" (the path, relative
  to the root of the repository, of the file the problem is in), "symbol" (the
  function, class or method it is in, a method written as Class.method) and,
  if you like, "note" (a sentence on what is wrong there). Nothing reads the
  note.

  That file is the deliverable. Do not put any of it right, and leave every
  other file exactly as you found it: a run that edits the code is graded
  unresolved however well it reviewed the change.
