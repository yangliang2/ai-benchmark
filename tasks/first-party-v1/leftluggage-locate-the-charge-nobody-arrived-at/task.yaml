# fault-location, and the "say where it is" half of round 7's first TypeScript
# planted defect. Same starting repository as
# leftluggage-put-the-unweighed-bag-back-on-the-scales, byte for byte, and the
# same one defect: `Charges.owedOn` in charges.ts ends `?? NOTHING_OWED`, so
# the `CANNOT_SAY` that `Tariff.forStay` hands back for a bag nobody wrote a
# weight down for comes back to the caller as a charge of nought — a refusal
# reported as a figure, and a figure indistinguishable from a bag that came in
# and went out inside the hour. Same symptom in the prompt, too: both members
# do the same detective work and only the deliverable differs, which is what
# makes "what does locating cost, as against fixing?" a reading of two actions
# rather than of two repositories.
#
# The scenario is a `node:http` service, which the Python corpus has nothing
# like (design note 45.11), and it is disclosed in the prompt and in the round
# record rather than as a task field.
#
# The accepted-answer key writes down both description levels that are
# legitimately correct for this defect: the method whose fallback throws the
# refusal away, and the class enclosing it. Naming the module alone is not one
# of them — on a repository this small a bare filename is barely a location —
# and the class level says strictly less than the module here, because
# charges.ts holds `Tariff`, `NOTHING_OWED`, `NOTHING_PAID` and `CANNOT_SAY`
# beside `Charges` rather than `Charges` alone.
#
# The terrain is what makes locating this work rather than a grep.
# `?? <constant>` is a shape a grep finds in one pass, so the repository holds
# nine more of them across all four modules and every one is correct:
# `Shelf.weighed` and `Shelf.leftBy` fall back to values that say outright
# there was nothing to be had, `writtenUp` writes a missing weight up as one,
# `Desk.noteOn` falls back to no note, `Charges.paidOn` falls back to nothing
# paid — a true statement about a bag nobody has paid on — and the rest are a
# request with no path on it, a port nobody named and two constructors given
# no map. Two of the ten are in charges.ts itself, so reaching the right file
# finishes nothing. The nearest twin is `writtenUp`: it falls back off the
# very same missing weight and is correct, because what it falls back to says
# the bag was not weighed rather than that nothing is owed on it — which is
# the whole discrimination, and no pattern shows it.
#
# The contract the defect breaks is stated in charges.ts's module comment and
# in the README, both a file's length from the line that breaks it. And the
# symptom the prompt reports points elsewhere first: the till and the list to
# go back over are made up in desk.ts, whose `Desk.cashUp` tests for
# `CANNOT_SAY` and would put the ticket on the list if it ever saw one —
# correct code that can never fire — and whose `Desk.answer` would answer 409
# for the same reason and never does; a missing weight comes from `Shelf.weighed`
# in shelf.ts; and `writtenUp` in tickets.ts is the twin. Those are the
# rejected near-misses no lint can invent.
#
# The hash gate is this corpus's own held-out gate for a keyed task: an agent
# that does the fix work and then writes a correct answer would grade resolved
# at fix-member cost, contaminating the one measurement this pair exists to
# produce, with nothing in the log to show it. So the repository the agent was
# handed is hashed, and a run that changed any of it grades unresolved. The
# prompt says so outright. It is generated by `ai-bench lint-v1
# --write-hash-gates` and never typed, and it is canonical Python whatever the
# repository's language, because what it reads is file digests and not source.
#
# What proves there is a defect here at all is this task's existence proof,
# and for fault-location that is the paired bug-fix member's held-out tests
# failing on this same pristine repository. A checked relation rather than a
# convention: the two declare no link — they are deliberately neither a task
# family nor a pair — so the lint finds the partner by the bytes of the repo/
# the two share, and runs it.
#
# A control: authored to fill a category, claiming nothing about difficulty.
# The two members are deliberately neither a task family nor a pair — both
# constructs require one varied knob and an agreed category, and these vary no
# knob and differ in category.
id: leftluggage-locate-the-charge-nobody-arrived-at
category: fault-location
scale: single-file
surface: application
language: typescript
control: true
# The nouns a prompt about a left-luggage office and a repository about one
# cannot help sharing. Read by the task-set lint's narrowing terrain rule,
# which holds every other word of the prompt to appearing in more than the
# module the accepted answer names.
domain_nouns: [bag, bags, ticket, tickets, office, counter, shelf, scales,
               weight, weighed, weigh, kilo, kilos, till, takings, charge,
               day, days, hour, luggage, node, http, service, library]
prompt: |
  Something has gone wrong at the left-luggage office. What is in front of you
  is the office's counter: a small HTTP service written on the Node standard
  library alone, with nothing installed under it.

  A bag came in on a morning the scales were out of order, so nobody wrote a
  weight down for it. When its owner came back the counter told them they owed
  nothing at all — as though the bag had come in and gone out inside the hour —
  and they went off with it. What went in the till that evening came out short
  by whatever that bag should have come to, and the list of tickets to put back
  on the scales came back empty, so nobody ever weighed it again.

  What the office means to do is this: where nobody wrote a weight down for a
  bag, the office has no charge against that bag at all. Nothing is asked for
  it over the counter, its ticket goes on the list to be weighed again, and
  nothing whatever is put in its place — least of all nothing itself, which is
  a perfectly ordinary charge and belongs to a bag that came in and went out
  inside the hour.

  Say where that defect lives. Do not fix it, and leave every file in the
  repository exactly as you found it: the deliverable is the location and not
  a repair, and a run that edits the code is graded unresolved however well it
  answers.

  Write your answer to ANSWER.json in the root of the repository, as a JSON
  object with two string fields: "file", the path of the file the defect is in
  relative to the repository root, and "symbol", the function, class or method
  it lives in (a method written as Class.method).
