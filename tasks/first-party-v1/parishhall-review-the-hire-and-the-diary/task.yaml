# code-review, the third of them in the corpus, and authored to the shape
# `launderette-review-the-rate-and-the-card` landed and
# `toolshed-review-the-lending-book` copied: the agent is handed a change that
# has already been applied to the starting repository, plus the unified diff of
# it the prompt names (repo/review.diff), and asked which of it is wrong. There
# is no second tree it can see — the change lives inside the repository — and
# the deliverable is the findings file, never an edit.
#
# The change is a winter's work at a parish hall: what an evening in one of its
# rooms is charged, and a hirer taking their bookings back out of the diary. It
# reads as a piece of work rather than as three bugs in a row, which is what a
# review has to be graded on: the house rules it is meant to keep are the
# README's, written down as the change was asked for and in the hall's own
# words, so each planted finding is the code disagreeing with a rule somebody
# wrote down rather than a matter of taste.
#
# The three planted findings, each named here by its primary — the most
# specific location, which is the first alternative in the key:
#
#   charges.py hire_for       the hire is rounded up to the pound and the
#                             heating added to the rounded figure, so what a
#                             winter evening is billed is not a whole pound at
#                             all — the rule rounds the whole of it.
#   charges.py price_of       the agreed price is tested for truth rather than
#                             for having been agreed, so the evening the
#                             committee agreed at nothing is billed the hire of
#                             the room.
#   diary.py Diary.cancel     the diary's own list is walked while entries are
#                             taken out of it, so the walk steps over the entry
#                             that moved up: of two bookings standing together,
#                             the second stays in the diary.
#
# Deliberately three shapes neither of the first two review tasks carries: they
# plant a boundary tested strictly, a counter never cleared, a list ordered the
# wrong way up, a substring where an equality was meant, a grouping lost to
# last-wins, and a caller sorting a list it does not own. Two rules composed in
# the wrong order, a zero read as nothing, and a list mutated under the walk
# that reads it are three further ways for a plausible change to be wrong, and
# no repetition of those six.
#
# A planted finding is a set of alternative locations and is matched if an
# answer matches any one of them, so each finding here writes down every level
# that legitimately describes it. Which is one level for two of the three:
#
#   hire_for        is defined at module level, so there is no enclosing class
#                   to be a second description of it.
#   price_of        is defined at module level too, and charges.py defines no
#                   class at all.
#   Diary.cancel    is a method of `Diary`, and diary.py defines `Booking`
#                   beside it, so `diary.py Diary` is a second alternative:
#                   telling the two classes apart takes reading them.
#
# Beneath the alternatives the comparison's own forgiveness still applies: a
# bare symbol answers a key spelled `Class.method`, so `cancel` and
# `Diary.cancel` both answer the third finding.
#
# The rejected non-findings are the two places a reviewer plausibly points at
# and is wrong to, and they are the half no lint can invent: `to_the_pound`
# rounds a charge up every time, which reads like an overcharge and is exactly
# what the house rules ask for; `takings` is the caller whose total comes out
# wrong, because it adds up prices the two defects above got wrong, and is
# itself correct.
#
# Each planted finding carries its existence proof in proofs/ — one per
# finding, named after its primary: a held-out test that fails on repo/, which
# ships the change applied, and passes on corrected/, the same repository with
# all three put right. A finding is one defect however many locations describe
# it, so it owes one proof and not one per alternative. Both trees sit beside
# repo/ and outside grading/, which is overlaid into the workdir wholesale, so
# the lint runs them and grading can neither collect nor copy them.
#
# The terrain: the prompt names neither a file nor a symbol of either half of
# the key, and its own vocabulary is either English's or the domain's below or
# appears outside the modules the findings live in — hall.py and caretaker.py
# are untouched by the change and carry the words a prompt about a parish hall
# cannot avoid, and each of them writes correctly the very thing a finding gets
# wrong: caretaker.py takes a person's keys out of the list of what is out
# while walking a copy of that list, and reads an hour of nothing as midnight
# rather than as no hour at all. The repository's own tests are green as it
# ships and name none of the three planted symbols: what the change added tests
# for is the part of it that works — the rounding, the winter months, and a
# summer evening nobody agreed a price for.
#
# The prompt's last three paragraphs are the first two review tasks', near
# enough word for word, and on purpose: what the deliverable is, how the
# findings file is shaped, and that an edited repository grades unresolved are
# the rules of this action rather than of this task, and three review tasks
# whose agents were told them differently would differ by their instructions as
# much as by their changes. What is this task's own is the paragraph that says
# which hall this is and which change is under review.
#
# The hash gate is the generator's (`ai-bench lint-v1 --write-hash-gates`) and
# never typed, and the prompt says outright what it enforces: the deliverable
# is the findings file, and a run that edited the code is graded unresolved
# however well it reviewed the change.
#
# A control: authored to fill a category, claiming nothing about difficulty. It
# is neither a family member nor a pair member, and it names no behaviour
# tests — those are a refactor task's.
id: parishhall-review-the-hire-and-the-diary
category: code-review
# The reference solution is the pristine tree plus the findings file, so the
# diff a solved run logs touches exactly one file.
scale: single-file
surface: application
language: python
control: true
# The nouns a prompt about a parish hall and a repository about one cannot help
# sharing. Read by the task-set lint's narrowing terrain rule, which holds
# every other word of the prompt to appearing somewhere other than the modules
# the planted findings live in.
domain_nouns: [hall, halls, room, rooms, booking, bookings, diary, hirer,
               hirers, committee, evening, evenings, hour, hours, day, days,
               month, months, price, prices, charge, charges, hire, key, keys,
               caretaker, pound, pounds, heating, rate, rates]
prompt: |
  This repository is what the committee of a parish hall keeps its bookings
  in, and review.diff in its root is a change that has already been applied to
  it: what that change was for is the last few house rules of the README,
  which were written down as it was asked for, and the code around it is what
  it looks like now.

  Read the change against those rules and say what is wrong with it. Report
  every problem it introduced and nothing that is not one — somewhere it got
  right, reported as a problem, is as wrong an answer as a problem you never
  mention.

  Write what you find to FINDINGS.json in the root of the repository, as a
  JSON list with one object per problem, each with "file" (the path, relative
  to the root of the repository, of the file the problem is in), "symbol" (the
  function, class or method it is in, a method written as Class.method) and,
  if you like, "note" (a sentence on what is wrong there). Nothing reads the
  note.

  That file is the deliverable. Do not put any of it right, and leave every
  other file exactly as you found it: a run that edits the code is graded
  unresolved however well it reviewed the change.
