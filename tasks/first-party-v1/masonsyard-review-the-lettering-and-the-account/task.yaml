# code-review, the ninth of them in the corpus and the first written in
# TypeScript, to the shape `launderette-review-the-rate-and-the-card` landed and
# the seven after it copied: the agent is handed a change that has already been
# applied to the starting repository, plus the unified diff of it the prompt
# names (repo/review.diff), and asked which of it is wrong. There is no second
# tree it can see — the change lives inside the repository — and the deliverable
# is the findings file, never an edit.
#
# The change is what a monumental mason's yard was asked for one winter: the
# words somebody gave set out for the chisel, and what a quarter of that work
# comes to. It reads as a piece of work rather than as three bugs in a row,
# which is what a review has to be graded on: the house rules it is meant to
# keep are the README's, written down as the change was asked for and in the
# yard's own words, so each planted finding is the code disagreeing with a rule
# somebody wrote down rather than a matter of taste.
#
# The three planted findings, each named here by its primary — the most
# specific location, which is the first alternative in the key:
#
#   inscription.ts asCut       `String.prototype.replace` with a string pattern
#                              writes out the first `&` and leaves every other
#                              one standing, where the rule is that every one an
#                              inscription was given is cut in full: a
#                              replacement made once where every occurrence was
#                              meant.
#   orders.ts Book.strikeOff   `delete` takes the order out of its place without
#                              closing the place up, so the book still counts
#                              what is no longer in it and what is left standing
#                              has a hole where the struck order was: a removal
#                              that leaves behind the place it was made in.
#   account.ts Account.comesTo every line is brought to whole shillings on its
#                              way past, so the odd pence are dropped a line at
#                              a time and never reach the foot: a rounding made
#                              at every step where the rule rounds once at the
#                              end.
#
# Two of the three are what TypeScript makes easy to get wrong and Python does
# not, which is the reason a TypeScript review task exists at all rather than a
# ninth Python one: `replace` with a string pattern is the first occurrence only
# — Python's `str.replace` is every occurrence, and the same three words mean
# the opposite thing — and `delete` on an array leaves the array the same length
# with a hole in it, where Python has no statement that does anything of the
# kind. The third is the arithmetic shape a per-line rounding always is, and is
# here because a review of three needs one finding that does not depend on
# knowing the language to see.
#
# None of the three repeats a shape the eight Python review tasks carry. Those
# plant a boundary tested strictly, a counter never cleared, a list ordered the
# wrong way up, a substring where an equality was meant, a grouping lost to
# last-wins, a caller sorting a list it does not own, two rules composed in the
# wrong order, a zero read as nothing, a list mutated under the walk that reads
# it, a special case written under the general rule that answers first, a
# default made once at import and kept between calls, a walk ended where it
# should have been stepped over, a collection handed out by reference where a
# copy was promised, a refusal swallowed and passed over as an ordinary answer,
# a remainder dropped by an integer division, a normalisation made on one side
# of a comparison only, two same-typed arguments swapped at a call whose callee
# is right, a number ordered by its text, an answer remembered under less than
# the question that produced it, a total over overlapping groups, and an average
# divided by the count of the wrong thing. The nearest of the three to any of
# them is the third — a remainder dropped by an integer division is also pence
# going missing — but that one drops a remainder once, where it was not meant to
# be dropped at all; this one drops it at every line and would be right if it
# were done once, at the foot, which is where the rule puts it.
#
# A planted finding is a set of alternative locations and is matched if an
# answer matches any one of them, so each finding here writes down every level
# that legitimately describes it:
#
#   asCut             is defined at module level, and inscription.ts defines no
#                     class at all, so there is no enclosing class to be a
#                     second description of it.
#   Book.strikeOff    is a method of `Book`, and orders.ts defines `Order`
#                     beside it, so `orders.ts Book` is a second alternative:
#                     telling the two classes apart takes reading them.
#   Account.comesTo   is a method of `Account`, and account.ts defines `Rate`
#                     and `Piece` beside it, so `account.ts Account` is a second
#                     alternative for the same reason.
#
# Beneath the alternatives the comparison's own forgiveness still applies: a
# bare symbol answers a key spelled `Class.method`, so `strikeOff` and
# `Book.strikeOff` both answer the second finding.
#
# The rejected non-findings are the two places a reviewer plausibly points at
# and is wrong to, and each stands next door to a real finding so that the
# reviewer who found one is the reviewer most likely to cry wolf about the
# other. `dateOn` takes the first date the words give and no other, which is a
# reviewer's first thought about a regular expression matched once — but the
# house rules say the head of a stone carries the first of two dates and a
# second one goes lower down, so taking the first is the rule, and the
# repository's own visible test says what it comes to. `Rate.forLetters` rounds
# a part hundred of lettering away, which is the same integer division a
# reviewer chasing the third finding has just been right about at the foot of an
# account — and the rules ask for it at this one place: lettering is charged by
# the hundred and a part hundred is not charged for at all, which the visible
# tests state outright.
#
# Each planted finding carries its existence proof in proofs/ — one per finding,
# named after its primary: a held-out test that fails on repo/, which ships the
# change applied, and passes on corrected/, the same repository with all three
# put right. They are `.test.ts` files because this task's runner is
# `node --test`: a proof is a test of the task's own language, and a `.py` proof
# here would be a file nothing could run. A finding is one defect however many
# locations describe it, so it owes one proof and not one per alternative. Both
# trees sit beside repo/ and outside grading/, which is overlaid into the
# workdir wholesale, so the lint runs them and grading can neither collect nor
# copy them.
#
# grading/ is this project's own Python whatever the repository's language, and
# has to be: a review's verdict is a JSON file read out of the workdir and a set
# of file digests, neither of which the repository's language has anything to do
# with. So the canonical `_findings.py` and the `_answer.py` it takes its
# location forgiveness from ship here byte for byte, with the one-line
# `test_findings.py` over them, and the task names no held-out test of its own.
#
# The repository is stdlib-only and flat: `node:` builtins and relative `.ts`
# imports and nothing else, no package.json, no node_modules, and no
# subdirectory — the hash gate that holds a keyed task to answering rather than
# repairing hashes top-level files only.
#
# The terrain: the prompt names neither a file nor a symbol of either half of
# the key, and its own vocabulary is either English's or the domain's below or
# appears outside the modules the findings live in — stones.ts and its tests
# carry the words a prompt about a mason's yard cannot avoid, and that module
# writes correctly the very thing the second finding gets wrong about a
# collection: `Yard.hewn` hands back a new yard rather than reaching into the
# one it was given. The change never reaches stones.ts, which is what the
# narrowing rule reads: a word of the prompt found there has selected nothing
# the review is hiding in. The repository's own tests are green as it ships and
# name none of the three planted symbols: what the change added tests for is the
# part of it that works — the date the head of a stone carries, the letters and
# figures there are to cut, what a stone is charged at by the inch, what a part
# hundred of lettering comes to, and what a line of an account is.
#
# The prompt's last three paragraphs are the eight Python review tasks', near
# enough word for word, and on purpose: what the deliverable is, how the
# findings file is shaped, and that an edited repository grades unresolved are
# the rules of this action rather than of this task, and nine review tasks whose
# agents were told them differently would differ by their instructions as much
# as by their changes. What is this task's own is the paragraph that says which
# yard this is and which change is under review.
#
# The hash gate is the generator's (`ai-bench lint-v1 --write-hash-gates`) and
# never typed, and the prompt says outright what it enforces: the deliverable is
# the findings file, and a run that edited the code is graded unresolved however
# well it reviewed the change.
#
# A control: authored to fill a category, claiming nothing about difficulty. It
# is neither a family member nor a pair member, and it names no behaviour
# tests — those are a refactor task's.
id: masonsyard-review-the-lettering-and-the-account
category: code-review
# The reference solution is the pristine tree plus the findings file, so the
# diff a solved run logs touches exactly one file.
scale: single-file
surface: application
language: typescript
control: true
# The nouns a prompt about a monumental mason's yard and a repository about one
# cannot help sharing. Read by the task-set lint's narrowing terrain rule, which
# holds every other word of the prompt to appearing somewhere other than the
# modules the planted findings live in.
domain_nouns: [mason, masons, yard, yards, stone, stones, mark, marks, chalk,
               chalked, slate, limestone, granite, inch, inches, hew, hewn,
               order, orders, book, books, cut, cuts, chisel, letter, letters,
               lettering, figure, figures, word, words, inscription,
               inscriptions, date, dates, head, heads, account, accounts, line,
               lines, foot, rate, rates, pence, shilling, shillings, piece,
               pieces, quarter, hundred, hundreds, given, week, weeks, node,
               library, program, ampersand]
prompt: |
  This repository is how a monumental mason's yard keeps its own work, and
  review.diff in its root is a change that has already been applied to it: what
  that change was for is the last few house rules of the README, which the
  yard agreed when it was asked for, and the code around it is what it looks
  like now.

  Read the change against those rules and say what is wrong with it. Report
  every problem it introduced and nothing that is not one — somewhere it got
  right, reported as a problem, is as wrong an answer as a problem you never
  mention.

  Write what you find to FINDINGS.json in the root of the repository, as a
  JSON list with one object per problem, each with "file" (the path, relative
  to the root of the repository, of the file the problem is in), "symbol" (the
  function, class or method it is in, a method written as Class.method) and,
  if you like, "note" (a sentence on what is wrong there). Nothing reads the
  note.

  That file is the deliverable. Do not put any of it right, and leave every
  other file exactly as you found it: a run that edits the code is graded
  unresolved however well it reviewed the change.
