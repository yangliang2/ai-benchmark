# refactor: extract a class from a class that does two jobs. The behaviour
# tests named below must PASS on the pristine repository; everything else in
# grading/ is a structural assertion that must FAIL on it until CouponPolicy
# exists and Cart genuinely delegates to it.
id: cart-extract-coupon-policy
category: refactor
scale: single-file
surface: application
language: python
prompt: |
  Cart in cart.py manages its items and, inline, all of the coupon
  bookkeeping too: registration, code normalisation, validation, and the
  percent lookup.

  Extract that bookkeeping into a CouponPolicy class in the same file. Give
  it register(code, percent), apply(code) and percent_off() so a policy is
  usable on its own — constructed with no arguments, and reporting zero
  percent off until a coupon is applied — and have Cart hold one as
  `self.policy` and delegate its existing coupon methods to it. The policy's
  state must be the only coupon state, not a copy of Cart's.

  This is a pure refactor: Cart's public interface and behaviour — add_item,
  register_coupon, apply_coupon, subtotal, discount, total, the error types
  and messages, and how coupon codes are normalised — must not change.
grading:
  behaviour_tests:
    - test_cart_behaviour.py
