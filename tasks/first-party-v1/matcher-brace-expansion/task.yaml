# feature-dev: the grading tests exercise expand, which does not exist in
# repo/, so they fail on the pristine repository as the lint requires.
id: matcher-brace-expansion
category: feature-dev
scale: single-file
language: python
prompt: |
  matchers.py does shell-style name matching with * and ?.

  Add a function `expand(pattern)` to matchers.py implementing brace
  expansion, the shell feature that turns one pattern into several before
  any matching happens: `expand("a{b,c}d")` gives ["abd", "acd"]. The rules:

  - Alternatives may be empty, so "img{,-2x}.png" gives both "img.png" and
    "img-2x.png".
  - Groups may be nested, as in "{a,b{c,d}}", and a pattern may contain
    several groups, expanded left to right with the rightmost group varying
    fastest — "{a,b}{1,2}" gives ["a1", "a2", "b1", "b2"].
  - A backslash escapes the character after it, making "\{", "\}" and "\,"
    literal braces and commas; the backslash itself does not appear in the
    result. A comma outside any group is literal anyway.
  - A pattern with no groups expands to a one-element list.
  - Unbalanced braces — an unclosed "{" or a "}" with no open group — raise
    ValueError.

  Keep the existing functions and their behaviour unchanged, and keep the
  module dependency-free (standard library only).
