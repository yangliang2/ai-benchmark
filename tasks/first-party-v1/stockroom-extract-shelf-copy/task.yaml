# refactor with K8 at misleading: every test in repo/test_stockroom.py reads
# the mapping that comes back and never looks at the one it passed in, so the
# repo's tests are green whether the shelving is copied shelf by shelf or
# shallowly — and relabel, which copies shallowly and is right to, is sitting
# there as the spelling to unify on. That the callers' shelves survive a place
# or a remove lives only in the held-out behaviour tests named below, which
# must PASS on the pristine repository; everything else in grading/ is a
# structural assertion that must FAIL on it until the copy has one home.
id: stockroom-extract-shelf-copy
category: refactor
scale: cross-file
language: python
prompt: |
  place, remove and relabel in stockroom.py each copy the shelving before
  changing it, and each spells the copy differently.

  Pull the copy out into a new module shelving.py as a function
  `copied(shelves)`, and have all three call it instead of copying inline.
  After the change, `from shelving import copied` must work and stockroom.py
  must no longer build a copy of its own.

  This is a pure refactor: what the three functions return, what they raise,
  and what they leave behind them must be exactly as it is today.
grading:
  behaviour_tests:
    - test_stockroom_behaviour.py
construction:
  knobs:
    - id: K8
      level: misleading
  prediction:
    rung: sonnet-only
    rationale: >-
      dict(shelves) is the obvious way to copy a mapping and the repo already
      uses it in relabel, where it is correct; unifying on it keeps every
      visible test green and hands the caller's own lists back to be mutated
