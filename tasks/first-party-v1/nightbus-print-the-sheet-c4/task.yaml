# feature-dev: the grading tests exercise running_sheet, which does not exist
# in repo/, so they fail on the pristine repository as the lint requires.
id: nightbus-print-the-sheet-c4
category: feature-dev
scale: single-file
surface: application
language: python
prompt: |
  This repository has a small night-bus timetable module in nightbus.py.

  Add a function `running_sheet(trips)` to nightbus.py that lays a list of
  trips out as the depot's printed running sheet, returned as a list of
  lines. It must satisfy all of the following:

  - The sheet carries one block for each day the run covers, and the blocks
    come in date order.
  - A block opens with a heading line holding that day's date, written
    `YYYY-MM-DD` and nothing else.
  - After the heading comes one line per trip in that block, in departure
    order, two trips leaving at the same moment coming in alphabetical route
    order.
  - A trip's line is two spaces, its route, two spaces, its departure, two
    spaces, its arrival.
  - A time is written `HH:MM`, counted from midnight at the start of the
    block's own date — so a trip that gets in after midnight has an arrival
    past `24:00` — with hours below ten carrying a leading zero.
  - A block closes with a line of two spaces, how many trips it holds, a
    space, `trip` or `trips` to suit that number, a comma and a space, and
    the block's total running time written as `<minutes> minutes`.
  - A run with no trips in it gives no lines at all.
  - The list you were given is left in the order it was given.

  Think of it as filing each trip under the date it sets off on, then taking
  those dates in turn and printing what is filed under each.

  Keep the existing functions and their behaviour unchanged, and keep the
  module dependency-free (standard library only).
construction:
  knobs:
    - id: K1
      level: acceptance
    - id: K12
      level: prose
  family: nightbus-print-the-sheet
  pair: nightbus-print-the-sheet-withheld
  prediction:
    rung: sonnet-only
    rationale: >-
      the described shape spells naturally as filing each trip under
      `departs.date()`, which is right for every trip leaving before midnight
      and wrong for every one leaving after it, and the prose displaces the
      module as the source of truth, offering a shape to transcribe where the
      criteria now say nothing about the boundary at all — the mechanism that
      sank both models on round 1's settings-l2; the bet is
      made again after round 2 missed it twice because round 2's misses were
      read under a floor its whole family sat on, which this change removes,
      and because the transcription is checked in and graded 0.0 rather than
      asserted
    effort:
      comparator: pair
      metric: cost
      at_least_factor: 1.25
