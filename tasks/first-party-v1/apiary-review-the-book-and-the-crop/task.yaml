# code-review, the seventh of them in the corpus, and authored to the shape
# `launderette-review-the-rate-and-the-card` landed and the five after it
# copied: the agent is handed a change that has already been applied to the
# starting repository, plus the unified diff of it the prompt names
# (repo/review.diff), and asked which of it is wrong. There is no second tree
# it can see — the change lives inside the repository — and the deliverable is
# the findings file, never an edit.
#
# The change is a summer's work on a village bee club's records: the harvest
# book the club sets down what has come off its hives in, and what a summer's
# crop of it comes to. It reads as a piece of work rather than as three bugs in
# a row, which is what a review has to be graded on: the house rules it is meant
# to keep are the README's, written down as the change was asked for and in the
# club's own words, so each planted finding is the code disagreeing with a rule
# somebody wrote down rather than a matter of taste.
#
# The three planted findings, each named here by its primary — the most
# specific location, which is the first alternative in the key:
#
#   harvest.py Book.taken_by   what the book works out once it keeps and hands
#                              back again, but it keeps it under the member
#                              alone while the question it answered named a
#                              member and a summer, so the second summer asked
#                              after comes back with the first one's pounds.
#   keepers.py Roll.hives_kept the hives are counted by adding up what each
#                             member keeps, so a hive kept between two is
#                             counted once for each name against it and the
#                             club is credited with a hive that stands nowhere.
#   crop.py off_a_hive         the crop is divided by the lots it came off in
#                              rather than by the hives it came off, so a
#                              summer in which one hive was gone through twice
#                              reads as a summer with an extra hive in it.
#
# Deliberately three shapes none of the first six review tasks carries. Those
# plant a boundary tested strictly, a counter never cleared, a list ordered the
# wrong way up, a substring where an equality was meant, a grouping lost to
# last-wins, a caller sorting a list it does not own, two rules composed in the
# wrong order, a zero read as nothing, a list mutated under the walk that reads
# it, a special case written under the general rule that answers first, a
# default made once at import and kept between calls, a walk ended where it
# should have been stepped over, a collection handed out by reference where a
# copy was promised, a refusal swallowed and passed over as an ordinary answer,
# a remainder dropped by an integer division, a normalisation made on one side
# of a comparison only, two same-typed arguments swapped at a call whose callee
# is right, and a number ordered by its text. An answer remembered under less
# than the question that produced it, a total over overlapping groups that
# counts what two of them share once for each, and an average divided by the
# count of the wrong thing are three further ways for a plausible change to be
# wrong, and no repetition of those eighteen. The nearest of the three to any of
# them is the first — a default made once at import is also state kept longer
# than it should be — but that one is state that was never asked for and is
# wrong from the second call on, where this is an answer that was right for the
# question it was worked out for and is handed to a different one.
#
# A planted finding is a set of alternative locations and is matched if an
# answer matches any one of them, so each finding here writes down every level
# that legitimately describes it:
#
#   Book.taken_by     is a method of `Book`, and harvest.py defines `Take`
#                     beside it, so `harvest.py Book` is a second alternative:
#                     telling the two classes apart takes reading them.
#   Roll.hives_kept   is a method of `Roll`, and keepers.py defines `Keeper`
#                     beside it, so `keepers.py Roll` is a second alternative
#                     for the same reason.
#   off_a_hive        is defined at module level, and crop.py defines no class
#                     at all, so there is no enclosing class to be a second
#                     description of it.
#
# Beneath the alternatives the comparison's own forgiveness still applies: a
# bare symbol answers a key spelled `Class.method`, so `hives_kept` and
# `Roll.hives_kept` both answer the second finding.
#
# The rejected non-findings are the two places a reviewer plausibly points at
# and is wrong to. `jars` is where the change puts a crop up for the shelf, and
# its integer division drops what is left over on purpose: the house rules say a
# crop goes up in whole jars and what will not fill one is left in the tank, so
# the remainder a reviewer reaches for is the rule rather than a defect, and the
# repository's own visible test says what it comes to. `Roll.keeping` is the
# method next door to the second finding and the one a reviewer chasing the
# joint-hive rule points at first — it hands back both members of a hive two of
# them keep, which is exactly what the rules ask for, and again the visible
# tests say so; what miscounts the hives is the method beside it and not this
# one.
#
# Each planted finding carries its existence proof in proofs/ — one per
# finding, named after its primary: a held-out test that fails on repo/, which
# ships the change applied, and passes on corrected/, the same repository with
# all three put right. A finding is one defect however many locations describe
# it, so it owes one proof and not one per alternative. Both trees sit beside
# repo/ and outside grading/, which is overlaid into the workdir wholesale, so
# the lint runs them and grading can neither collect nor copy them.
#
# The terrain: the prompt names neither a file nor a symbol of either half of
# the key, and its own vocabulary is either English's or the domain's below or
# appears outside the modules the findings live in — apiary.py and its tests
# carry the words a prompt about a bee club cannot avoid, and that module writes
# correctly the very thing the second finding gets wrong: `stands_in_use` counts
# the stands two hives share as the one stand, over the set of them rather than
# by adding up what each hive sits on. The change reaches apiary.py — a crop has
# to be put up in something — but no planted finding lives there, which is what
# the narrowing rule reads: a word of the prompt found in apiary.py has not
# selected a module the review is hiding in. The repository's own tests are
# green as it ships and name none of the three planted symbols: what the change
# added tests for is the part of it that works — a lot set down in the book as
# it came off, the lots one hive gave up, what a summer's crop comes to and what
# it fills.
#
# The prompt's last three paragraphs are the first six review tasks', near
# enough word for word, and on purpose: what the deliverable is, how the
# findings file is shaped, and that an edited repository grades unresolved are
# the rules of this action rather than of this task, and seven review tasks
# whose agents were told them differently would differ by their instructions as
# much as by their changes. What is this task's own is the paragraph that says
# which club this is and which change is under review.
#
# The hash gate is the generator's (`ai-bench lint-v1 --write-hash-gates`) and
# never typed, and the prompt says outright what it enforces: the deliverable
# is the findings file, and a run that edited the code is graded unresolved
# however well it reviewed the change.
#
# A control: authored to fill a category, claiming nothing about difficulty. It
# is neither a family member nor a pair member, and it names no behaviour
# tests — those are a refactor task's.
id: apiary-review-the-book-and-the-crop
category: code-review
# The reference solution is the pristine tree plus the findings file, so the
# diff a solved run logs touches exactly one file.
scale: single-file
surface: application
language: python
control: true
# The nouns a prompt about a village bee club and a repository about one cannot
# help sharing. Read by the task-set lint's narrowing terrain rule, which holds
# every other word of the prompt to appearing somewhere other than the modules
# the planted findings live in.
domain_nouns: [apiary, apiaries, bee, bees, hive, hives, keeper, keepers, keep,
               keeps, kept, club, clubs, member, members, roll, secretary,
               honey, jar, jars, crop, crops, comb, frame, frames, yard, yards,
               stand, stands, summer, summers, lot, lots, book, books, mark,
               marks, pound, pounds, tank, harvest, hut, shelf]
prompt: |
  This repository is what a village bee club has the summer's honey in, and
  review.diff in its root is a change that has already been applied to it: what
  that change was for is the last few house rules of the README, which were
  written down as it was asked for, and the code around it is what it looks
  like now.

  Read the change against those rules and say what is wrong with it. Report
  every problem it introduced and nothing that is not one — somewhere it got
  right, reported as a problem, is as wrong an answer as a problem you never
  mention.

  Write what you find to FINDINGS.json in the root of the repository, as a
  JSON list with one object per problem, each with "file" (the path, relative
  to the root of the repository, of the file the problem is in), "symbol" (the
  function, class or method it is in, a method written as Class.method) and,
  if you like, "note" (a sentence on what is wrong there). Nothing reads the
  note.

  That file is the deliverable. Do not put any of it right, and leave every
  other file exactly as you found it: a run that edits the code is graded
  unresolved however well it reviewed the change.
